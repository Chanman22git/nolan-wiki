<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nolan Wiki — Chat</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1a1c20; --muted:#6b7280; --line:#e4e7eb;
  --bot:#f0f2f5; --user:#2f6df6; --user-ink:#fff; --accent:#2f6df6;
  --chip:#eef1f5; --chip-ink:#33373d; --badge-ref:#0a7d4d; --badge-crit:#b45309; --warn:#8a5a00;
}
:root[data-theme="dark"], :root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#161a20; --ink:#e8eaed; --muted:#9aa2ad; --line:#262b33;
    --bot:#1d222a; --user:#3b7bff; --user-ink:#fff; --accent:#5b8bff;
    --chip:#232833; --chip-ink:#c9cfd8; --badge-ref:#34d399; --badge-crit:#f59e0b; --warn:#f0b429;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#161a20; --ink:#e8eaed; --muted:#9aa2ad; --line:#262b33;
  --bot:#1d222a; --user:#3b7bff; --user-ink:#fff; --accent:#5b8bff;
  --chip:#232833; --chip-ink:#c9cfd8; --badge-ref:#34d399; --badge-crit:#f59e0b; --warn:#f0b429;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.app{max-width:820px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--panel);
  border-left:1px solid var(--line);border-right:1px solid var(--line);}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
header .dot{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6df6,#7b3ff6);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
header h1{font-size:15px;margin:0;font-weight:650}
header p{margin:1px 0 0;font-size:12px;color:var(--muted)}
header .meta{margin-left:auto;font-size:11px;color:var(--muted);text-align:right}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;align-items:flex-end}
.bubble{padding:11px 14px;border-radius:14px;white-space:normal;word-wrap:break-word}
.bot .bubble{background:var(--bot);border-top-left-radius:5px}
.user .bubble{background:var(--user);color:var(--user-ink);border-top-right-radius:5px}
.bubble h3{margin:0 0 6px;font-size:15px}
.bubble .sub{color:var(--muted);font-size:12.5px;margin:-2px 0 8px}
.bubble p{margin:8px 0}
.bubble ul{margin:6px 0;padding-left:18px}
.bubble li{margin:3px 0}
.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 3px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:999px;
  padding:4px 10px;font-size:12.5px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.badge{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600;vertical-align:middle}
.badge.reference{background:color-mix(in srgb,var(--badge-ref) 18%,transparent);color:var(--badge-ref)}
.badge.criticism{background:color-mix(in srgb,var(--badge-crit) 18%,transparent);color:var(--badge-crit)}
.cite{margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.cite b{color:var(--ink);font-weight:600}
.warn{color:var(--warn);font-size:12px;margin-top:7px}
.reading{padding:8px 11px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);
  border-radius:0 8px 8px 0;margin:7px 0}
.reading .att{color:var(--muted);font-size:12px}
.stance{font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--chip-ink);font-weight:600}
footer{border-top:1px solid var(--line);padding:12px 14px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.inrow{display:flex;gap:8px}
#q{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;
  padding:11px 13px;font-size:14.5px;outline:none}
#q:focus{border-color:var(--accent)}
#send{border:none;background:var(--accent);color:#fff;border-radius:11px;padding:0 18px;font-weight:600;cursor:pointer;font-size:14px}
#send:active{transform:translateY(1px)}
a.pagelink{color:var(--accent);text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--accent)}
</style>
</head>

de to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf"], "tiers": ["criticism", "reference", "criticism", "criticism"], "summary": "Rival Victorian magicians **Borden** (Bale) and **Angier** (Jackman) obsessively try to outdo each other. The double twist: Borden is secretly identical twins; Angier uses a **Tesla** cloning machine (Bowie plays Tesla). Adapted from a **Christopher Priest** novel. Genres Sci-Fi/Mystery/Thriller/Drama; released Oct 20 2006, 130 min. The Directors Series notes real LA locations standing in for London and Thom Yorke's 'Analyse' over the credits.", "body": "The Prestige (2006) Rival Victorian magicians Borden (Bale) and Angier (Jackman) obsessively try to outdo each other. The double twist: Borden is secretly identical twins; Angier uses a Tesla cloning machine (Bowie plays Tesla). Adapted from a Christopher Priest novel. Genres Sci-Fi/Mystery/Thriller/Drama; released Oct 20 2006, 130 min. The Directors Series notes real LA locations standing in for London and Thom Yorke's 'Analyse' over the credits. Key people: PER-christopher-nolan , PER-jonathan-nolan , PER-hugh-jackman , PER-christian-bale , PER-michael-caine , PER-scarlett-johansson , PER-david-bowie , PER-rebecca-hall , PER-emma-thomas , PER-wally-pfister , PER-david-julyan , PER-lee-smith , PER-nathan-crawley Craft (The Directors Series): TEC-real-locations , TEC-handheld-camera , TEC-shepard-tone Provenance: 6 Christopher Nolan Movies That Are 10_10, No Notes.pdf (criticism); Every Christopher Nolan Movie Explained, From 'Inception' to 'Interstellar' - Business Insider.pdf (reference); The Ultimate Guide to Christopher Nolan's Movies_.pdf (criticism); Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf (criticism)"}, {"slug": "INT-inception-ending-ambiguous", "type": "interpretation", "id": "INT-002", "title": "", "name": "", "aka": [], "year": "", "status": "draft", "roles": [], "stance": "critical", "element": "the final shot of the spinning top (is Cobb still dreaming?)", "reading": "The finale is deliberately, classically ambiguous", "attributed_to": "Nik Grozdanović / Screen Reflections; corroborated by Cameron Beyl / The Directors Series", "motifs": [], "people": [], "films": [], "used_in": [], "recurs_in": [], "film": "FILM-inception", "sources": ["The Ultimate Guide to Christopher Nolan's Movies_.pdf", "Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf"], "tiers": ["criticism", "criticism"], "summary": "", "body": "The finale is deliberately, classically ambiguous Film: FILM-inception | Element: the final shot of the spinning top (is Cobb still dreaming?) | Stance: critical Both criticism sources read the final shot as intentionally unresolved rather than a puzzle to decode — 'a classically ambiguous finale' (Screen Reflections) that cements 'the film's murky ambiguity between dreams and waking reality' (The Directors Series). The ambiguity is the intended payoff. Cluster: INT-inception-ending , INT-inception-ending-mal-totem , INT-inception-ending-authorial . Provenance: The Ultimate Guide to Christopher Nolan's Movies_.pdf (criticism); Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf (criticism) Facts here rest only on criticism-tier source(s) and remain provisional pending reference-tier confirmation."}, {"slug": "INT-inception-ending-authorial", "type": "interpretation", "id": "INT-004", "title": "", "name": "", "aka": [], "year": "", "status": "draft", "roles": [], "stance": "authorial", "element": "the final shot of the spinning top (is Cobb still dreaming?)", "reading": "Nolan: whether the top topples is beside the point — Cobb has stopped watching", "attributed_to": "Christopher Nolan (per The Directors Series)", "motifs": [], "people": [], "films": [], "used_in": [], "recurs_in": [], "film": "FILM-inception", "sources": ["Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf"], "tiers": ["criticism"], "summary": "", "body": "Nolan: whether the top topples is beside the point — Cobb has stopped watching Film: FILM-inception | Element: the final shot of the spinning top (is Cobb still dreaming?) | Stance: authorial The source reports Nolan's own stated view: the meaningful detail is not whether the top falls but that, for the first time, Cobb isn't watching it — he has moved on emotionally, finding happiness in his reunion with his family. An authorial framing that treats the reality question as deliberately secondary. Cluster: INT-inception-ending , INT-inception-ending-ambiguous , INT-inception-ending-mal-totem . Provenance: Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf (criticism) Facts here rest only on criticism-tier source(s) and remain provisional pending reference-tier confirmation."}, {"slug": "INT-inception-ending-mal-totem", "type": "interpretation", "id": "INT-003", "title": "", "name": "", "aka": [], "year": "", "status": "draft", "roles": [], "stance": "critical", "element": "the final shot of the spinning top (is Cobb still dreaming?)", "reading": "The top is Mal's totem, not Cobb's — so it can't confirm his reality", "attributed_to": "Cameron Beyl / The Directors Series", "motifs": [], "people": [], "films": [], "used_in": [], "recurs_in": [], "film": "FILM-inception", "sources": ["Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf"], "tiers": ["criticism"], "summary": "", "body": "The top is Mal's totem, not Cobb's — so it can't confirm his reality Film: FILM-inception | Element: the final shot of the spinning top (is Cobb still dreaming?) | Stance: critical The source argues the ring-based 'it's real' reading is itself undercut: Nolan establishes (via Arthur) that one cannot use another's totem, and the spinning top is actually Mal's totem, not Cobb's — raising the possibility that Cobb has been lost in his own subconscious 'from the very start.' Cluster: INT-inception-ending , INT-inception-ending-ambiguous , INT-inception-ending-authorial . Provenance: Ultimate Guide to Christopher Nolan and His Directing Techniques _ Indie Film Hustle®.pdf (criticism) Facts here rest only on criticism-tier source(s) and remain provisional pending reference-tier confirmation."}, {"slug": "INT-inception-ending", "type": "interpretation", "id": "INT-001", "title": "", "name": "", "aka": [], "year": "", "status": "draft", "roles": [], "stance": "critical", "element": "the final shot of the spinning top (is Cobb still dreaming?)", "reading": "The ending is probably real, not a dream", "attributed_to": "Jacob Sarkisian / Business Insider", "motifs": [], "people": [], "films": [], "used_in": [], "recurs_in": [], "film": "FILM-inception", "sources": ["Every Christopher Nolan Movie Explained, From 'Inception' to 'Interstellar' - Business Insider.pdf"], "tiers": ["reference"], "summary": "", "body": "The ending is probably real, not a dream Film: FILM-inception | Element: the final shot of the spinning top (is Cobb still dreaming?) | Stance: critical The reference source argues the reunion is most likely real : Cobb wears his wedding ring only inside dreams, and in the final scene he is ringless. Competing readings (cluster): INT-inception-ending-ambiguous (deliberately unresolved), INT-inception-ending-mal-totem (the ring clue is itself undercut), INT-inception-ending-authorial (Nolan: the question is beside the point). The Directors Series notes the wedding-ring argument is itself 'a deception,' complicating this reading. Neither reading is marked correct. Provenance: Every Christopher Nolan Movie Explained, From 'Inception' to 'Interstellar' - Business Insider.pdf (reference)"}, {"slug": "INT-memento-objective-reality", "type": "interpretation", "id": "INT-005", "title": "", "name": "", "aka": [], "year": "", "status": "draft", "roles": [], "stance": "authorial", "element": "whether Leonard's ac     (groups[r]=groups[r]||[]).push(ps);
  });
  var order=ROLE_ORDER.concat(Object.keys(groups).filter(function(r){return ROLE_ORDER.indexOf(r)<0;}));
  var html="";
  order.forEach(function(r){
    if(!groups[r]) return;
    var label=r.charAt(0).toUpperCase()+r.slice(1)+(groups[r].length>1?"s":"");
    html+='<li><b>'+esc(label)+':</b> '+linklist(groups[r])+'</li>';
  });
  return html;
}

// ---- renderers ----
function renderFilm(p){
  var used=[p.slug];
  var h='<h3>🎬 '+esc(p.title)+(p.year?' ('+p.year+')':'')+'</h3>';
  if(p.summary) h+='<p>'+fmt(p.summary)+'</p>';
  if(p.motifs.length){ used=used.concat(p.motifs);
    h+='<div class="k">Motifs</div>'+linklist(p.motifs); }
  else { h+='<div class="k">Motifs</div><span style="color:var(--muted)">none linked in the sources (flagged in the wiki)</span>'; }
  var techs=PAGES.filter(function(x){return x.type==="technique" && x.used_in.indexOf(p.slug)>=0;}).map(function(x){return x.slug;});
  if(techs.length){ used=used.concat(techs); h+='<div class="k">Craft / techniques</div>'+linklist(techs); }
  if(p.people.length){ used=used.concat(p.people);
    h+='<div class="k">People</div><ul>'+peopleByRole(p.slug)+'</ul>'; }
  var ints=PAGES.filter(function(x){return x.type==="interpretation" && x.film===p.slug;});
  if(ints.length){ used=used.concat(ints.map(function(i){return i.slug;}));
    h+='<div class="k">Contested readings ('+ints.length+')</div>'+
       ints.map(function(i){return link(i.slug);}).join(" · ")+
       '<div style="font-size:12px;color:var(--muted);margin-top:4px">Ask about the ending to see the full cluster.</div>'; }
  h+=citeBlock(used);
  return h;
}
function renderPerson(p){
  var h='<h3>👤 '+esc(p.name)+'</h3>';
  var roles=p.roles.join(", ")||"—";
  h+='<div class="sub">'+esc(roles)+(p.aka.length?' · also credited as '+esc(p.aka.join(", ")):'')+'</div>';
  if(p.summary) h+='<p>'+fmt(p.summary)+'</p>';
  h+='<div class="k">Films ('+p.films.length+')</div>'+(p.films.length?linklist(p.films):'—');
  if(p.films.length>=2) h+='<p style="color:var(--muted);font-size:12.5px">↳ A recurring collaborator — a hub node in the wiki graph.</p>';
  return h+citeBlock([p.slug].concat(p.films));
}
function renderMotif(p){
  var h='<h3>🔺 '+esc(p.name)+'</h3>';
  if(p.summary) h+='<p>'+fmt(p.summary)+'</p>';
  h+='<div class="k">Recurs in</div>'+linklist(p.recurs_in);
  return h+citeBlock([p.slug].concat(p.recurs_in));
}
function renderTechnique(p){
  var h='<h3>🎛 '+esc(p.name)+'</h3>';
  if(p.summary) h+='<p>'+fmt(p.summary)+'</p>';
  h+='<div class="k">Used in</div>'+linklist(p.used_in);
  return h+citeBlock([p.slug].concat(p.used_in));
}
function renderCluster(ints){
  var byEl={};
  ints.forEach(function(i){ (byEl[i.element]=byEl[i.element]||[]).push(i); });
  var used=[], h="";
  Object.keys(byEl).forEach(function(el){
    var group=byEl[el]; var film=BY[group[0].film];
    h+='<h3>🎬 '+esc(film?film.title:"")+' — a contested element</h3>';
    h+='<div class="sub">Element: '+esc(el)+'</div>';
    h+='<p>The wiki records <b>'+group.length+' reading'+(group.length>1?'s':'')+'</b> of this — kept side by side, none marked correct (that is the point):</p>';
    group.forEach(function(i){
      used.push(i.slug);
      h+='<div class="reading"><div>'+esc(i.reading)+' <span class="stance">'+esc(i.stance)+'</span></div>'+
         '<div class="att">— '+esc(i.attributed_to)+'</div></div>';
    });
  });
  h+=citeBlock(used);
  return h;
}
function renderConnections(ents){
  var films=ents.filter(function(p){return p.type==="film";});
  var ppl=ents.filter(function(p){return p.type==="person";});
  var used=ents.map(function(p){return p.slug;});
  var h='<h3>🔗 Connections</h3><div class="sub">'+ents.map(function(p){return esc(shortdisp(p.slug));}).join(" · ")+'</div>';
  var found=false;
  if(films.length>=2){
    var sm=films[0].motifs.filter(function(m){return films.every(function(f){return f.motifs.indexOf(m)>=0;});});
    var sp=films[0].people.filter(function(x){return films.every(function(f){return f.people.indexOf(x)>=0;});});
    if(sm.length){found=true;used=used.concat(sm);h+='<div class="k">Shared motifs</div>'+linklist(sm);}
    if(sp.length){found=true;used=used.concat(sp);h+='<div class="k">Shared collaborators</div>'+linklist(sp);}
  }
  if(ppl.length>=2){
    var sf=ppl[0].films.filter(function(x){return ppl.every(function(pp){return pp.films.indexOf(x)>=0;});});
    if(sf.length){found=true;used=used.concat(sf);h+='<div class="k">Films they share</div>'+linklist(sf);}
  }
  if(films.length && ppl.length){
    ppl.forEach(function(pp){
      films.forEach(function(f){
        var inIt=f.people.indexOf(pp.slug)>=0;
        h+='<p>'+link(pp.slug)+(inIt?' <b>is</b> credited on ':' is <b>not</b> credited on ')+link(f.slug)+' in the wiki.</p>';
        found=true;
      });
    });
  }
  if(!found) h+='<p style="color:var(--muted)">No direct shared link recorded. Here are the pages individually:</p>'+
    ents.map(function(p){return link(p.slug);}).join(" · ");
  return h+citeBlock(used);
}
function keywordSearch(q){
  var toks=q.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/)
    .filter(function(t){return t.length>=3 && !STOP.has(t);});
  if(!toks.length) return [];
  var scored=PAGES.map(function(p){
    var hay=((p.title+" "+p.name+" "+(p.aka||[]).join(" ")+" ")).toLowerCase();
    var sum=(p.summary||"").toLowerCase(), body=(p.body||"").toLowerCase();
    var s=0; toks.forEach(function(t){
      if(hay.indexOf(t)>=0) s+=6;
      if(sum.indexOf(t)>=0) s+=3;
      var m=body.split(t).length-1; s+=Math.min(m,4);
    });
    return {p:p,s:s};
  }).filter(function(x){return x.s>0;});
  scored.sort(function(a,b){return b.s-a.s;});
  return scored.slice(0,6).map(function(x){return x.p;});
}
function renderHits(hits){
  var h='<h3>🔍 Closest matches in the wiki</h3>';
  h+='<ul>'+hits.map(function(p){
    var kind=p.type;
    return '<li>'+link(p.slug)+' <span style="color:var(--muted);font-size:12px">('+kind+')</span>'+
      (p.summary?' — '+fmt(p.summary.slice(0,140))+(p.summary.length>140?'…':''):'')+'</li>';
  }).join("")+'</ul>';
  return h+citeBlock(hits.map(function(p){return p.slug;}));
}
function renderNone(){
  return '<h3>Not in the wiki</h3>'+
   '<p>I can\'t find that in the ingested pages. Per the wiki\'s rules I answer <b>only</b> from the sources and won\'t fill the gap from memory.</p>'+
   '<p style="color:var(--muted)">Try a film, person, motif, technique, or the Inception ending. Examples below.</p>';
}

var INT_RE=/ending|final shot|spinning top|totem|dream|dreaming|ambig|is it real|really.*dream|\bmal\b|subjective|objective realit|still (dreaming|asleep)/i;
function answer(qraw){
  var q=" "+qraw.toLowerCase().trim()+" ";
  var ents=matchEntities(q);
  var filmEnts=ents.filter(function(p){return p.type==="film";});
  // interpretation intent
  if(INT_RE.test(qraw)){
    var targets=filmEnts.map(function(f){return f.slug;});
    if(!targets.length){
      if(/memento/.test(q)) targets=["FILM-memento"];
      else targets=["FILM-inception"]; // default: the famous one
    }
    var ints=PAGES.filter(function(x){return x.type==="interpretation" && targets.indexOf(x.film)>=0;});
    if(ints.length) return renderCluster(ints);
  }
  if(ents.length>=2) return renderConnections(ents);
  if(ents.length===1){
    var p=ents[0];
    if(p.type==="film") return renderFilm(p);
    if(p.type==="person") return renderPerson(p);
    if(p.type==="motif") return renderMotif(p);
    if(p.type==="technique") return renderTechnique(p);
  }
  var hits=keywordSearch(qraw);
  if(hits.length) return renderHits(hits);
  return renderNone();
}

// ---- chat plumbing ----
var log=document.getElementById("log");
function add(role,html){
  var m=document.createElement("div"); m.className="msg "+role;
  var b=document.createElement("div"); b.className="bubble"; b.innerHTML=html;
  m.appendChild(b); log.appendChild(m); log.scrollTop=log.scrollHeight; return m;
}
function ask(text){
  text=(text||"").trim(); if(!text) return;
  add("user",esc(text));
  var t=add("bot",'<span style="color:var(--muted)">…searching the wiki</span>');
  setTimeout(function(){ t.querySelector(".bubble").innerHTML=answer(text); log.scrollTop=log.scrollHeight; },120);
}
var qEl=document.getElementById("q");
document.getElementById("send").onclick=function(){ ask(qEl.value); qEl.value=""; qEl.focus(); };
qEl.addEventListener("keydown",function(e){ if(e.key==="Enter"){ ask(qEl.value); qEl.value=""; } });
log.addEventListener("click",function(e){
  var a=e.target.closest(".pagelink"); if(a){ var s=a.getAttribute("data-slug"); var p=BY[s];
    ask(p&&p.type==="interpretation" ? (BY[p.film]?BY[p.film].title:"")+" ending" : "Tell me about "+disp(s)); return; }
  var c=e.target.closest(".chip[data-q]"); if(c){ ask(c.getAttribute("data-q")); }
});

var EX=[
 "What does the spinning top at the end of Inception mean?",
 "Tell me about The Prestige",
 "Which films use the apocalypse motif?",
 "What films has Michael Caine worked on?",
 "How are Inception and Memento connected?",
 "What is the Shepard tone?",
 "Who directed Tenet and what is it about?"
];
document.getElementById("suggest").innerHTML=
  EX.map(function(x){return '<button class="chip" data-q="'+esc(x)+'">'+esc(x)+'</button>';}).join("");
document.getElementById("suggest").addEventListener("click",function(e){
  var c=e.target.closest(".chip"); if(c) ask(c.getAttribute("data-q"));
});

add("bot",'<h3>Ask the Nolan wiki 🎬</h3>'+
  '<p>I answer from '+DATA.count+' ingested pages — '+
  PAGES.filter(function(p){return p.type==="film";}).length+' films, '+
  PAGES.filter(function(p){return p.type==="person";}).length+' people, '+
  PAGES.filter(function(p){return p.type==="motif";}).length+' motifs, '+
  PAGES.filter(function(p){return p.type==="technique";}).length+' techniques, '+
  PAGES.filter(function(p){return p.type==="interpretation";}).length+' contested readings.</p>'+
  '<p>Everything is cited, and every page is a draft (unreviewed). I won\'t answer from memory — only from the wiki. Try a suggestion below.</p>');
})();
</script>
